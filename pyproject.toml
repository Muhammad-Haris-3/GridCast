[project]
name = "gridcast"
version = "0.1.0"
description = "A self-grading grid carbon forecasting service"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gridcast*", "api*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DTZ"]
# DTZ is enabled deliberately: it flags naive datetime construction.
# Every timestamp in this project is UTC-aware (design doc section 2).

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

# Put the repository root on sys.path.
#
# `python -m pytest` adds the working directory automatically; the `pytest`
# console script does not. Without this the suite passes locally and fails in
# CI with ModuleNotFoundError, having never imported the project at all — which
# is worse than failing, because the green ticks meant nothing.
pythonpath = ["."]
markers = [
    "db: requires a live Postgres connection (set GRIDCAST_DATABASE_URL)",
]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
