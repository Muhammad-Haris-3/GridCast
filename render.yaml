# Render blueprint for the GridCast serving API.
#
# The API reads precomputed rows and never trains (NFR-6), which is what keeps
# it inside the 512 MB free-tier container. Model training runs in GitHub
# Actions, where memory is somebody else's problem.

services:
  - type: web
    name: gridcast-api
    runtime: python
    plan: free
    # Must match the Neon project's region. The database is in AWS us-east-2,
    # so the API sits in Ohio beside it. Every request the API serves is a
    # database round trip; splitting them across the Atlantic would add ~100ms
    # to each one, on a free instance that is already cold-starting.
    #
    # The data is British, but the latency that matters is API-to-database, not
    # API-to-source: ingestion runs in GitHub Actions, not here.
    region: ohio
    buildCommand: pip install -r requirements-serve.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.1"
      - key: GRIDCAST_ENV
        value: production
      # GRIDCAST_COMMIT is deliberately not set here. Render injects
      # RENDER_GIT_COMMIT automatically, and gridcast.config falls back to it —
      # fromService only supports host/port/hostport/connectionString, so a
      # commit-id lookup would fail blueprint validation rather than resolve.
      #
      # Set in the Render dashboard, never here:
      #   GRIDCAST_READONLY_DATABASE_URL — the gridcast_readonly Neon role.
      # The pipeline URL is deliberately NOT available to this service. If the
      # API held write credentials, the append-only guarantee would rest on the
      # API never choosing to use them.
