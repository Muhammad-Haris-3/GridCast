name: gridcast
version: 0.1.0
config-version: 2

profile: gridcast

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Design doc 6.2: the incremental lookback is a variable, not a literal, so
  # M2's measurement of the revision tail changes it without a code edit.
  lookback_days: 14

  # Design doc 6.2.1 (D-1). PROVISIONAL. M2 measured the demand publication lag
  # at 30 minutes flat through p99, but could not measure the ESO actuals lag:
  # every backfilled row carries the backfill's fetch time, so asking when its
  # actuals appeared answers "all of them, today". That lag must be observed
  # forward, and M5 must not open its scoreboard before it has been.
  maturity_hours: 24
  stability_hours: 6

  # The upper bound of physical plausibility for GB carbon intensity.
  #
  # Highest actual observed across eight years is 447 gCO2/kWh; a grid running
  # entirely on coal would be roughly 900. 800 is deliberately loose — a tight
  # bound fitted to observed history would fail on a legitimately extreme day
  # and teach everyone to ignore the test.
  #
  # It exists because the ESO forecast field carries 16 corrupt values up to
  # 13,579 (M4). The design specified a range test on `actual` at 5.1 and it was
  # never implemented; even implemented, it would have missed this, because the
  # corruption is in the forecast rather than the outturn.
  plausible_max_gco2_kwh: 800

  # Design doc 6.5 (D-2). PROVISIONAL, pending the weather backfill.
  # step_hold invents nothing; linear interpolation manufactures a value nobody
  # published. Decided by measured backtest error, not by preference.
  weather_alignment: step_hold

  # The spine starts the day before the earliest observed data. Verified
  # 2026-08-12: /intensity/date/2018-05-10 returns populated forecast/actual
  # pairs from 2018-05-09T23:00Z.
  spine_start_utc: "2018-05-09 00:00:00+00"

  # 60 days of forward spine: enough for a 48-hour forecast horizon plus room
  # for the table to go stale without breaking joins.
  spine_forward_days: 60

models:
  gridcast:
    +materialized: view
    staging:
      +schema: staging
    marts:
      +schema: marts
      +materialized: table
