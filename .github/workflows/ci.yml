name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python, DDL, dbt
    runs-on: ubuntu-latest

    # A real Postgres, not a mock. The append-only guarantee is enforced by
    # database grants, and grants cannot be tested against a fake.
    services:
      postgres:
        # Matches the Neon production server (18.x). Testing the schema on a
        # different major version than it runs on is a gap worth not having,
        # particularly for the grants and check constraints in sql/003 and 004.
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gridcast
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      GRIDCAST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gridcast
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGPORT: "5432"
      PGDATABASE: gridcast
      PGSSLMODE: disable

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Apply schema
        run: python -m gridcast.migrate

      - name: Build warehouse
        working-directory: dbt_gridcast
        run: dbt build --profiles-dir .

      - name: Tests, including the append-only guarantees
        run: |
          set -o pipefail
          pytest -v -rA 2>&1 | tee pytest-output.txt

      # GitHub requires sign-in to read job logs, even on a public repository,
      # but annotations are readable anonymously. Publishing the failure into an
      # annotation means anyone can see WHY a build broke without credentials —
      # which is the same principle the rest of this project runs on.
      - name: Surface the failure
        if: failure()
        run: |
          DETAIL=$(tail -60 pytest-output.txt \
            | sed 's/%/%25/g; s/\r//g' \
            | awk '{printf "%s%%0A", $0}')
          echo "::error title=pytest failed::$DETAIL"

  web:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Type check
        working-directory: web
        run: npm run typecheck

      - name: Build
        working-directory: web
        run: npm run build
