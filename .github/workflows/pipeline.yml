name: Pipeline

# Every 30 minutes, matching the settlement period.
#
# GitHub's cron is best-effort: runs are delayed under load and skipped
# entirely when the platform is busy. That is not worked around, because it
# cannot be. Instead every run ends with gap detection, so a run that never
# happened becomes a gap the next run closes. The target in NFR-1 is coverage,
# not punctuality.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

# A delayed run must never overlap the next one. Two ingestions writing the same
# window concurrently would both see "no existing row" and both insert.
concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  ingest:
    name: Ingest, heal, rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Write access is for the snapshots branch and nothing else. The register
    # lives in Postgres and is never written from here.
    permissions:
      contents: write

    env:
      GRIDCAST_DATABASE_URL: ${{ secrets.GRIDCAST_DATABASE_URL }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -r requirements-pipeline.txt

      - name: Ingest scheduled sources
        run: python -m gridcast.ingest --scheduled --days 2

      # Runs even if ingestion failed: a partial failure is exactly when the
      # gaps appear, so skipping the heal would leave the hole open until the
      # next successful run.
      - name: Heal gaps
        if: always()
        run: python -m gridcast.gapfill --lookback 7

      - name: Rebuild warehouse
        id: rebuild
        if: always()
        working-directory: dbt_gridcast
        run: dbt build --profiles-dir .
        env:
          PGHOST: ${{ secrets.PGHOST }}
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PGDATABASE: ${{ secrets.PGDATABASE }}
          PGSSLMODE: require

      # Forecasting needs a database it can write to. Probed on its own, rather
      # than inferred from the rebuild, because dbt connects with the PG*
      # credentials and issuing with GRIDCAST_DATABASE_URL: the rebuild
      # succeeding does not prove the register is reachable. Runs after an
      # ingest failure for the same reason the heal does.
      - name: Check the database is reachable
        id: database
        if: always()
        run: |
          python - <<'PY'
          from gridcast.db import connect

          with connect() as conn, conn.cursor() as cur:
              cur.execute("SELECT 1")
          print("database reachable")
          PY

      # Issue forecasts AFTER the warehouse rebuild, so the model forecasts from
      # matured actuals rather than from whatever landed thirty seconds ago.
      #
      # Runs even if ingestion failed. One source timing out used to cost every
      # model its forecast — on 2026-09-28 an om_forecast ReadTimeout meant no
      # B0, B1 or ESO_published either, none of which reads weather, and a hole
      # in the register cannot be refilled once the moment has passed. A failed
      # source now costs only the models that depend on it: G2 refuses to issue
      # on weather that does not cover every target (assert_weather_reaches) and
      # records the refusal in landing.run_log instead.
      #
      # It does NOT run when the database is unreachable or the warehouse
      # rebuild failed. Forecasting from a broken build would write rows built
      # on actuals nobody can vouch for into a register that cannot be
      # corrected; skipping leaves an honest gap. `!cancelled()` rather than
      # `always()` so a cancelled run still stops here. The run stays red
      # either way: the ingest step's failure is still a failure, and
      # "Surface the failure" below still fires.
      - name: Issue forecasts
        if: ${{ !cancelled() && steps.database.outcome == 'success' && steps.rebuild.outcome == 'success' }}
        run: python -m gridcast.forecast
        env:
          GRIDCAST_DATABASE_URL: ${{ secrets.GRIDCAST_DATABASE_URL }}

      # Every run, not only the daily one. A forecast becomes scoreable the
      # moment its target matures, and scoring promptly keeps the public
      # accuracy figures as close to live as the data allows.
      - name: Score matured forecasts
        if: always()
        run: python -m gridcast.score
        env:
          GRIDCAST_DATABASE_URL: ${{ secrets.GRIDCAST_DATABASE_URL }}

      # Everything below publishes the static surface the frontend actually
      # reads. It runs even when the steps above failed, because a failed run
      # is exactly when the status payload — which carries the diagnosis — is
      # worth republishing.
      #
      # Start from what is already on the branch. The publish is a force-push
      # of a single orphan commit, so anything absent from this directory is
      # deleted from the branch; without the clone, a payload that failed to
      # build would be removed rather than left at its previous value, which is
      # the opposite of what gridcast/snapshot.py is careful to do.
      - name: Fetch the published snapshots
        if: always()
        env:
          REPO: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          if ! git clone --quiet --depth 1 --branch snapshots "$REPO" snapshots; then
            echo "no snapshots branch yet — this run creates it"
            mkdir -p snapshots
            git -C snapshots init --quiet
          fi

      - name: Build snapshots
        if: always()
        run: python -m gridcast.snapshot --out snapshots

      # An orphan commit every time, force-pushed. The branch is a cache: it
      # carries no history worth keeping, and accumulating 48 commits a day of
      # derived JSON would grow the repository without ever being read. Keeping
      # it to one commit also makes it unmistakable that this is not the record
      # — the register is in Postgres and the seals are on main.
      #
      # This branch carries data, not a site. Vercel deploys every branch it is
      # given, so each of these 48 daily pushes queued a build that failed on
      # "Root Directory web does not exist" — a red mark every half hour for a
      # branch that was never meant to be built.
      #
      # The opt-out committed to web/vercel.json on main did not stop it, and
      # could not: Vercel reads that file from the commit it is deploying, at
      # the project Root Directory, and this branch had no web/ directory to
      # read it from. gridcast.snapshot now writes the same declaration into
      # the published tree, so the branch carries its own.
      - name: Publish snapshots
        if: always()
        env:
          REPO: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          cd snapshots
          rm -rf .git
          git init --quiet
          git checkout --quiet -b snapshots
          git add -A
          git -c user.name="gridcast-pipeline" \
              -c user.email="gridcast-pipeline@users.noreply.github.com" \
              commit --quiet -m "snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ) from ${GITHUB_SHA:0:12}"
          git push --quiet --force "$REPO" snapshots

      # Keeps the run red when any step failed — ingestion included, now that
      # forecasting carries on past it. The forecasts that did issue are real;
      # the source that failed still needs someone to look at it.
      - name: Surface the failure
        if: failure()
        run: echo "::error title=pipeline::Ingestion, forecasting or the warehouse build failed. Check landing.run_log for the source and error class."

