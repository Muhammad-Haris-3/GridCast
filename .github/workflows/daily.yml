name: Daily

# The slower-moving sources, once a day at 04:00 UTC.
#
# Separate from the 30-minute pipeline because polling any of these every half
# hour would be waste on somebody else's free service: regional intensity
# returns 17 rows per settlement period, the weather archive lags reality by
# days, and price is published once per period and then does not move.
#
# 04:00 UTC is chosen for the same reason: it is the quietest part of the GB
# grid day, so a slow response costs nothing.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  daily:
    name: Daily sources and deep heal
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GRIDCAST_DATABASE_URL: ${{ secrets.GRIDCAST_DATABASE_URL }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -r requirements-pipeline.txt

      - name: Ingest daily sources
        run: python -m gridcast.ingest --daily --days 5

      # A wider sweep than the half-hourly run. The 7-day lookback there closes
      # ordinary lateness; this one catches an outage long enough that nobody
      # noticed it at the time.
      - name: Deep heal
        if: always()
        run: python -m gridcast.gapfill --lookback 30

      - name: Report coverage
        if: always()
        run: python -m gridcast.gapfill --lookback 30 --detect-only

      # Prune old landing rows to stay within Neon's 512 MB ceiling.
      #
      # The pipeline (every 30 min) runs dbt build, which materialises
      # fct_weather_hour. Once that table holds the typed weather, the raw
      # JSON in lnd_om_vintage is dead weight. This step deletes it daily,
      # keeping only a short window for revision capture.
      #
      # The script verifies fct_weather_hour exists before deleting anything.
      # Rebuild the warehouse BEFORE pruning, never after.
      #
      # The prune is only safe because the typed marts already hold what is
      # being discarded. Building first guarantees that is true at the moment
      # the rows are released; pruning first leaves a window where the marts are
      # stale and the raw data is already gone.
      #
      # Every model that exists so its source can be pruned is incremental, so
      # this build accumulates rather than rebuilds. That is load-bearing: the
      # same step run against a table-materialised model destroyed 434,592 rows
      # of weather history, because a table model is rebuilt from a source that
      # by then held only the retention window.
      - name: Rebuild warehouse before pruning
        working-directory: dbt_gridcast
        run: dbt build --profiles-dir .
        env:
          PGHOST: ${{ secrets.PGHOST }}
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PGDATABASE: ${{ secrets.PGDATABASE }}
          PGSSLMODE: require

      # Recalibrate the published intervals, once a day, from a year of matured
      # actuals.
      #
      # Issuing used to do this every thirty minutes, which meant reading 17,520
      # rows to arrive at sixteen numbers that had not moved. The window is a
      # modelling choice and is unchanged; only the frequency was wrong. Runs
      # after the warehouse rebuild so it calibrates on fresh marts.
      #
      # Allowed to fail the workflow. A calibration that cannot be computed is
      # worth a red run — issuing degrades to the previous set and says how old
      # it is, so the site stays up while this gets looked at.
      - name: Recalibrate intervals
        run: python -m gridcast.calibrate

      # The transfer allowance, once a day, with the period still open enough
      # to act on. Non-fatal: --report annotates and returns zero, because a
      # budget that fails the workflow would stop the ingestion that is the
      # point of the workflow — the opposite of what running out costs.
      - name: Report database transfer
        if: always()
        run: python -m gridcast.usage --report

      # Only runs if the build above succeeded. `if: always()` here would prune
      # on the strength of marts that failed to refresh.
      - name: Prune landing tables
        run: python scripts/prune_landing.py --execute

      # Seal any newly closed month and verify every existing seal.
      #
      # Runs last and is allowed to fail the workflow. A seal mismatch means
      # either the register changed after sealing or the sealing procedure is
      # broken, and both must stop the pipeline rather than be noted in a log
      # nobody reads.
      - name: Seal and audit the register
        run: python -m gridcast.seal
        env:
          GRIDCAST_DATABASE_URL: ${{ secrets.GRIDCAST_DATABASE_URL }}

      # New seals are evidence and belong in git, where their history is public
      # and timestamped. That is what lets anyone verify the register without
      # access to the database.
      - name: Commit new seals
        if: success()
        run: |
          if [ -n "$(git status --porcelain seals/)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seals/
            git commit -m "Seal the register for the closed month"
            git push
          else
            echo "no new seals to commit"
          fi
